<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kill-Switch Cuentas</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        h1 { font-size: 1.2rem; color: #ff5252; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .btn { display: block; background: #1e1e1e; color: #fff; padding: 18px; margin-bottom: 15px; text-decoration: none; border-radius: 12px; font-weight: 600; border: 1px solid #333; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-google { border-left: 5px solid #4285F4; }
        .btn-apple { border-left: 5px solid #A2AAAD; }
        .btn-whatsapp { border-left: 5px solid #25D366; }
        .btn-critical { background: #b71c1c; border-color: #f44336; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Urgencia Seguridad</h1>
    
    <a class="btn btn-google" href="https://myaccount.google.com/device-activity" target="_blank">
        Google: Ver Dispositivos Activos
    </a>
    
    <a class="btn btn-apple" href="https://account.apple.com/account/manage" target="_blank">
        Apple: Gestionar Dispositivos iCloud
    </a>

    <a class="btn btn-whatsapp" href="https://web.whatsapp.com" target="_blank">
        WhatsApp: Gestión Multidispositivo
    </a>
    
    <a class="btn btn-google btn-critical" href="https://myaccount.google.com/signinoptions/password" target="_blank">
        KILL-SWITCH: Cambiar Pass Google (Global)
    </a>
</body>
</html>
